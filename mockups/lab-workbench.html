<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Workbench — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F7F9; --card: #fff; --line: #EAECF0; --line-2: #D0D5DD; --hover: #F9FAFB;
  --text: #101828; --text-2: #475467; --text-3: #98A2B3;
  --brand: #049794; --brand-2: #037C79; --brand-50: #E8F6F5; --brand-100: #C9ECEA;
  --navy: #023459;
  --red: #D92D20; --red-50: #FEF3F2; --red-100: #FEE4E2;
  --amber: #B54708; --amber-50: #FFFAEB; --amber-100: #FEF0C7;
  --green: #067647; --green-50: #ECFDF3;
  --blue: #175CD3; --blue-50: #EFF8FF;
  --violet: #6941C6; --violet-50: #F4F3FF;
  --r: 12px; --shadow: 0 1px 2px rgba(16,24,40,.05); --shadow-lg: 0 12px 32px -6px rgba(16,24,40,.16);
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.5 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
kbd { font: 500 11px Inter, sans-serif; min-width: 20px; padding: 1px 6px; border: 1px solid var(--line-2); border-radius: 5px; background: #fff; color: var(--text-2); text-align: center; display: inline-block; }

.app { display: grid; grid-template-columns: 68px 1fr; height: 100vh; }

/* rail */
.rail { background: var(--navy); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 14px; }
.rbtn { width: 42px; height: 42px; border-radius: 10px; border: 0; background: none; color: rgba(255,255,255,.55); display: grid; place-items: center; position: relative; }
.rbtn svg.i { width: 20px; height: 20px; }
.rbtn:hover { background: rgba(255,255,255,.08); color: #fff; }
.rbtn.on { background: rgba(255,255,255,.12); color: #fff; }
.rbtn .dot { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #F97066; }
.rail .sp { flex: 1; }
.me { width: 36px; height: 36px; border-radius: 50%; background: #2E5A7D; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }

.main { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; }

/* header */
.head { display: flex; align-items: center; gap: 24px; padding: 16px 24px 12px; }
.title h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.title p { margin: 1px 0 0; font-size: 13px; color: var(--text-2); }
.scan { position: relative; flex: 1; max-width: 560px; margin-left: auto; }
.scan input { width: 100%; height: 42px; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 70px 0 42px; background: #fff; outline: none; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.scan input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-50); }
.scan > svg.i { position: absolute; left: 14px; top: 13px; color: var(--text-3); width: 18px; height: 18px; }
.scan kbd { position: absolute; right: 12px; top: 11px; }
.scan.ok input { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-100); }
.scan.miss input { border-color: var(--red); box-shadow: 0 0 0 4px var(--red-100); }
.drop { position: absolute; top: 48px; left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 30; padding: 6px; }
.drop button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; }
.drop button.on, .drop button:hover { background: var(--hover); }
.drop .st { margin-left: auto; }
.mockpill { font-size: 11.5px; font-weight: 600; color: var(--violet); background: var(--violet-50); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.hbtn { height: 42px; padding: 0 14px; border: 1px solid var(--line-2); background: #fff; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text-2); box-shadow: var(--shadow); white-space: nowrap; }
.hbtn:hover { color: var(--text); background: var(--hover); }

/* steps */
.steps { display: flex; gap: 6px; padding: 0 24px 14px; }
.step { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text-2); font-weight: 500; }
.step:hover { background: #fff; border-color: var(--line); }
.step.on { background: #fff; border-color: var(--line); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.step.on svg.i { color: var(--brand); }
.badge { min-width: 22px; height: 20px; padding: 0 7px; border-radius: 99px; background: #EEF0F3; color: var(--text-2); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.step.on .badge { background: var(--brand); color: #fff; }
.badge.red { background: var(--red-50); color: var(--red); }

/* body */
.body { display: grid; grid-template-columns: 372px 1fr; gap: 16px; padding: 0 24px 20px; min-height: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* list */
.list { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.lhead { display: flex; gap: 6px; padding: 12px; border-bottom: 1px solid var(--line); }
.chipbtn { height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.chipbtn span { color: var(--text-3); font-weight: 500; }
.chipbtn:hover { background: var(--hover); }
.chipbtn.on { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand-2); }
.chipbtn.on span { color: var(--brand); }
.rows { overflow: auto; flex: 1; padding: 6px; }
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.row + .row { margin-top: 2px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--brand-50); border-color: var(--brand-100); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.rn { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rn b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rn small { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.rs { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.rr { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.wait { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wait svg.i { width: 13px; height: 13px; }
.wait.late { color: var(--red); font-weight: 500; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: #F2F4F7; color: var(--text-2); white-space: nowrap; }
.tag.code { font-weight: 600; letter-spacing: .01em; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.stat { background: var(--red-50); color: var(--red); }
.pill.urgent { background: var(--amber-50); color: var(--amber); }
.pill.ok { background: var(--green-50); color: var(--green); }
.pill.info { background: var(--blue-50); color: var(--blue); }
.pill.nodot::before { display: none; }
.empty { padding: 60px 20px; text-align: center; color: var(--text-3); }
.empty svg.i { width: 32px; height: 32px; color: var(--line-2); margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }

/* detail */
.detail { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.dscroll { flex: 1; overflow: auto; padding: 20px 24px; }
.ph { display: flex; align-items: center; gap: 14px; }
.ph .av { width: 52px; height: 52px; font-size: 18px; }
.ph h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; }
.ph .sub { display: flex; align-items: center; gap: 8px; margin-top: 3px; color: var(--text-2); font-size: 13.5px; }
.ph .grow { flex: 1; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; }
.fact { padding: 10px 14px; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact label { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.fact div { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sec { margin-top: 20px; }
.sech { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sech h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sech .meta { color: var(--text-3); font-size: 13px; }
.sech .grow { flex: 1; }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.prog i { width: 80px; height: 6px; border-radius: 99px; background: #EEF0F3; overflow: hidden; display: inline-block; }
.prog i b { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .2s; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; margin-top: 16px; font-size: 13.5px; }
.banner svg.i { width: 18px; height: 18px; margin-top: 1px; }
.banner.crit { background: var(--red-50); border: 1px solid var(--red-100); color: #912018; }
.banner.warn { background: var(--amber-50); border: 1px solid var(--amber-100); color: #93370D; }
.banner b { font-weight: 600; }
.banner .grow { flex: 1; }
.banner input { height: 32px; border: 1px solid #FDA29B; border-radius: 8px; padding: 0 10px; background: #fff; outline: none; }
.banner input:focus { box-shadow: 0 0 0 3px var(--red-100); }

/* tubes */
.tubes { border: 1px solid var(--line); border-radius: 10px; }
.tube { display: grid; grid-template-columns: 28px 190px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; }
.tube + .tube { border-top: 1px solid var(--line); }
.cap { width: 14px; height: 32px; border-radius: 4px 4px 8px 8px; background: linear-gradient(var(--c) 0 34%, #EEF1F4 34%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); justify-self: center; }
.tube .tn b { display: block; font-weight: 600; }
.tube .tn span { color: var(--text-3); }
.tube .tt { display: flex; flex-wrap: wrap; gap: 6px; }
.tube .ta { display: flex; align-items: center; gap: 8px; }

/* results */
.tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.res { width: 100%; border-collapse: collapse; }
.res th { background: var(--hover); font-size: 12px; font-weight: 500; color: var(--text-2); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.res td { padding: 0 14px; height: 48px; border-bottom: 1px solid var(--line); }
.res tr:last-child td { border-bottom: 0; }
.res tr.g td { height: 40px; background: #FCFCFD; font-weight: 600; font-size: 13px; color: var(--text); }
.res tr.g td span { color: var(--text-3); font-weight: 400; margin-left: 6px; }
.res td.u, .res td.rg { color: var(--text-2); font-size: 13px; white-space: nowrap; }
.res td.pv { color: var(--text-2); font-size: 13px; white-space: nowrap; }
.res td.pv small { color: var(--text-3); margin-left: 4px; }
.res tr.cur td { background: #FAFEFE; }
.vin { width: 110px; height: 36px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none; background: #fff; transition: border-color .12s, box-shadow .12s; }
.vin:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-50); }
.vsel { height: 36px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; font-weight: 600; background: #fff; outline: none; min-width: 130px; }
.vsel:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-50); }
.ro { font-weight: 600; font-variant-numeric: tabular-nums; }
tr.H .vin, tr.L .vin, tr.H .ro, tr.L .ro { color: var(--amber); border-color: #FEC84B; }
tr.HH .vin, tr.LL .vin, tr.HH .ro, tr.LL .ro { color: var(--red); border-color: #FDA29B; }
tr.HH td, tr.LL td { background: #FFFBFA; }
.flag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.flag.H, .flag.L, .flag.A { background: var(--amber-50); color: var(--amber); }
.flag.HH, .flag.LL { background: var(--red-50); color: var(--red); }
.flag.N { background: none; color: var(--text-3); font-weight: 500; padding: 0; }

/* send */
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.opt { position: relative; display: block; padding: 16px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .12s, box-shadow .12s, background .12s; }
.opt:hover { border-color: var(--line-2); }
.opt input { position: absolute; top: 16px; right: 16px; accent-color: var(--brand); width: 16px; height: 16px; margin: 0; }
.opt .oi { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #F2F4F7; color: var(--text-2); margin-bottom: 12px; }
.opt b { display: block; font-weight: 600; }
.opt span { color: var(--text-2); font-size: 13px; }
.opt:has(input:checked) { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-50); background: #FBFEFE; }
.opt:has(input:checked) .oi { background: var(--brand-50); color: var(--brand); }

/* action bar */
.act { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line); background: #fff; }
.act .st { font-size: 13.5px; color: var(--text-2); display: inline-flex; align-items: center; gap: 8px; }
.act .st.crit { color: var(--red); font-weight: 500; }
.act .grow { flex: 1; }
.btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { background: var(--hover); color: var(--text); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; box-shadow: none; }
.btn.ghost:hover { background: #F2F4F7; }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-50); border-color: #FDA29B; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; padding: 0 20px; }
.btn.pri:hover { background: var(--brand-2); }
.btn.pri:disabled { background: #9ED9D7; border-color: #9ED9D7; cursor: not-allowed; }
.btn.pri kbd { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); color: #fff; }
.lnk { border: 0; background: none; color: var(--brand-2); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; }
.lnk:hover { background: var(--brand-50); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(16,24,40,.28); backdrop-filter: blur(2px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer { position: fixed; top: 10px; right: 10px; bottom: 10px; width: 420px; background: #fff; border-radius: 16px; z-index: 41; box-shadow: var(--shadow-lg); transform: translateX(calc(100% + 20px)); transition: transform .25s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; }
body.open .scrim { opacity: 1; pointer-events: auto; }
body.open .drawer { transform: none; }
.dr-h { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; }
.dr-h .av { width: 42px; height: 42px; }
.dr-h b { display: block; font-size: 16px; }
.dr-h small { color: var(--text-2); }
.dr-h .x { margin-left: auto; width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; color: var(--text-3); display: grid; place-items: center; }
.dr-h .x:hover { background: #F2F4F7; color: var(--text); }
.seg { display: flex; gap: 2px; margin: 0 20px; padding: 3px; background: #F2F4F7; border-radius: 10px; }
.seg button { flex: 1; height: 32px; border: 0; background: none; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.seg button.on { background: #fff; color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.dr-b { padding: 18px 20px; overflow: auto; flex: 1; }
dl.kv { display: grid; grid-template-columns: 130px 1fr; gap: 12px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--text-2); }
dl.kv dd { margin: 0; font-weight: 500; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding-bottom: 20px; position: relative; }
.tl .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #F2F4F7; color: var(--text-3); position: relative; z-index: 1; }
.tl .ic svg.i { width: 14px; height: 14px; }
.tl li.d .ic { background: var(--brand-50); color: var(--brand); }
.tl li:not(:last-child)::after { content: ''; position: absolute; left: 13.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
.tl b { font-weight: 500; display: block; }
.tl li:not(.d) b { color: var(--text-3); }
.tl small { color: var(--text-3); }
.tl .t { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.hist { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.hist th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 0 0 8px; }
.hist td { padding: 9px 0; border-top: 1px solid var(--line); }
.hist .r { text-align: right; font-variant-numeric: tabular-nums; }

/* popover */
.pop { position: absolute; top: 64px; right: 24px; width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 16px; z-index: 35; }
.pop h4 { margin: 0 0 12px; font-size: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--hover); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat label { display: block; font-size: 12px; color: var(--text-2); }
.stat b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.keys { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; font-size: 13px; color: var(--text-2); }

.toast { position: fixed; bottom: 92px; left: calc(68px + 24px + 372px + 16px + (100vw - 68px - 48px - 388px) / 2); transform: translate(-50%, 10px); background: #101828; color: #fff; padding: 10px 12px 10px 14px; border-radius: 12px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .ti { width: 20px; height: 20px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; }
.toast .ti svg.i { width: 12px; height: 12px; stroke-width: 3; }
.toast.bad .ti { background: var(--red); }
.toast button { border: 0; background: rgba(255,255,255,.1); color: #fff; font-weight: 600; border-radius: 8px; padding: 4px 10px; margin-left: 6px; }
.toast button:hover { background: rgba(255,255,255,.18); }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="logo">N</div>
    <button class="rbtn" title="Home"><svg class="i" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="rbtn on" title="Lab Workbench"><svg class="i" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.5L4.5 19a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.5V3"/><path d="M7 15h10"/></svg></button>

const AV = [['#E8F6F5', '#037C79'], ['#EFF8FF', '#175CD3'], ['#F4F3FF', '#6941C6'], ['#FDF2FA', '#C11574'], ['#FFFAEB', '#B54708'], ['#ECFDF3', '#067647']];

    body = `${header}<div id="critBox"></div>
      <div class="sec"><div class="sech"><h3>${edit ? 'Enter results' : 'Review results'}</h3><span class="meta">${edit ? 'Press Enter to move to the next box' : `Entered by Vignesh Raj at ${clock(v.resultsAt)}`}</span><span class="grow"></span><span class="prog" id="prog"></span></div>
      <div class="tbl"><table class="res"><thead><tr><th style="width:26%">Test</th><th>Result</th><th>Flag</th><th>Unit</th><th>Normal range</th><th>Last result</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    secondary = edit ? `<button class="btn danger" data-act="reject">${ic('ban')}Reject sample</button><button class="btn" data-act="draft">${ic('save')}Save draft</button>`
      : `<button class="btn" data-act="back">${ic('back')}Send back</button>`;
    d.innerHTML = frame(body, '<span class="st" id="st"></span>', secondary, edit ? 'Save results' : 'Verify & release');
  } else if (v.stage === 'send') {
    body = `${header}<div class="sec"><div class="sech"><h3>Send report</h3><span class="meta">Verified at ${clock(v.verifiedAt)} · ${v.tests.map((c) => T[c].name).join(', ')}</span><span class="grow"></span><button class="lnk" data-act="preview">${ic('eye')}Preview report</button></div>
      <div class="opts"><label class="opt"><input type="checkbox" name="ch" value="wa" checked><span class="oi">${ic('chat')}</span><b>WhatsApp to patient</b><span>${v.phone}</span></label>
        <label class="opt"><input type="checkbox" name="ch" value="doc"><span class="oi">${ic('doctor')}</span><b>WhatsApp to doctor</b><span>${esc(v.doc)}</span></label>
        <label class="opt"><input type="checkbox" name="ch" value="print"><span class="oi">${ic('printer')}</span><b>Print copy</b><span>Patient collects at the lab counter</span></label></div></div>`;
    d.innerHTML = frame(body, `<span class="st">${ic('verify')}Report verified and ready</span>`, '', 'Send report');
  }
  wire(v);
  if (v.stage === 'results' || v.stage === 'verify') refreshStatus(v);
}
const frame = (body, status, secondary, primary) => `<div class="dscroll">${body}</div><div class="act">${status}<span class="grow"></span>${secondary}<button class="btn pri" id="go">${primary}<kbd>${primary === 'Save results' ? 'Ctrl ↵' : '↵'}</kbd></button></div>`;

function refreshStatus(v) {
  const cs = crits(v); const total = params(v).length; const done = params(v).filter((p) => v.values[p.name] !== '').length;
  $('#prog').innerHTML = `${done} of ${total}<i><b style="width:${(done / total) * 100}%"></b></i>`;
  const st = $('#st');
  if (cs.length) { st.className = 'st crit'; st.innerHTML = `${ic('alert')}${cs.length} critical value${cs.length > 1 ? 's' : ''}${v.stage === 'results' && done < total ? `<span style="color:var(--text-2);font-weight:400">· ${total - done} left to enter</span>` : ''}`; }
  else { st.className = 'st'; st.innerHTML = v.stage === 'results' ? `${ic('results')}${done < total ? `${total - done} left to enter` : 'All results entered'}` : `${ic('verify')}Check against the last result, then release`; }
  const box = $('#critBox');
  if (cs.length) box.innerHTML = `<div class="banner crit">${ic('alert')}<div class="grow"><b>Critical: ${cs.map((p) => `${p.name} ${v.values[p.name]} ${p.unit}`).join(', ')}</b><br>${v.stage === 'results' ? 'Re-run or re-check the sample before saving.' : 'Phone the doctor before releasing, and note who you spoke to.'}
      ${v.stage === 'verify' ? `<div style="display:flex;gap:8px;margin-top:10px;align-items:center"><input id="infName" placeholder="Doctor informed" value="${esc(v.doc)}" style="flex:1"><input id="infAt" value="${clock(new Date().toISOString())}" style="width:100px"></div>` : ''}</div></div>`;
  else box.innerHTML = '';
  if (v.stage === 'results') $('#go').disabled = done < total;
}

// ---------- drawer: the extra detail ----------
function renderDrawer() {
  document.body.classList.toggle('open', !!S.drawer);
  const v = V.find((x) => x.id === S.drawer); if (!v) return;
  const tl = [['pay', 'Billed and paid', v.createdAt, 'Reception · Bill NH-B-' + v.sid.slice(-4)], ['collect', 'Sample collected', v.tubes.every((t) => t.collected) && v.tubes[0].collected, 'Vignesh Raj'], ['receive', 'Received in lab', v.tubes.every((t) => t.received) && v.tubes[0].received, 'Vignesh Raj'], ['results', 'Results entered', v.resultsAt, 'Vignesh Raj'], ['verify', 'Verified', v.verifiedAt, 'Dr. M. Kavitha, Pathologist'], ['send', 'Report sent', v.sentAt, 'WhatsApp']];
  let b = '';
  if (S.dtab === 'details') b = `<dl class="kv"><dt>UHID</dt><dd class="mono">${v.uhid}</dd><dt>Sample ID</dt><dd class="mono">${v.sid}</dd><dt>Mobile</dt><dd>${v.phone}</dd><dt>Age / sex</dt><dd>${v.age} years · ${v.sex === 'M' ? 'Male' : 'Female'}</dd>
    <dt>From</dt><dd>${v.src}${v.bed ? ` · ${v.ward} ward, bed ${v.bed}` : v.token ? ` · token ${v.token}` : ''}</dd><dt>Doctor</dt><dd>${esc(v.doc)}<br><span style="color:var(--text-3);font-weight:400">${esc(v.dept)}</span></dd>
    <dt>Tests</dt><dd>${v.tests.map((c) => T[c].name).join('<br>')}</dd><dt>Tubes</dt><dd>${v.tubes.map((t) => `${CAPS[t.cap][0]} <span class="mono" style="color:var(--text-3)">${t.code}</span>`).join('<br>')}</dd></dl>`;
  if (S.dtab === 'timeline') b = `<ul class="tl">${tl.map(([i, l, t, by]) => `<li class="${t ? 'd' : ''}"><span class="ic">${ic(i)}</span><div><b>${l}</b>${t ? `<small>${by}</small>` : '<small>Pending</small>'}</div><span class="t">${t ? clock(t) : ''}</span></li>`).join('')}</ul>`;
  if (S.dtab === 'history') { const ps = params(v).filter((p) => p.prev != null); b = ps.length ? `<p style="margin:0 0 12px;color:var(--text-2);font-size:13px">Last visit · 3 October · ${esc(v.doc)}</p><table class="hist"><tr><th>Test</th><th class="r">Result</th></tr>${ps.map((p) => `<tr><td>${p.name}</td><td class="r">${p.prev} <span style="color:var(--text-3)">${p.unit}</span></td></tr>`).join('')}</table>` : '<p style="color:var(--text-3)">No earlier results.</p>'; }
  $('#drawer').innerHTML = `<div class="dr-h">${avatar(v)}<div><b>${esc(v.name)}</b><small>${v.age} ${v.sex} · ${where(v)}</small></div><button class="x" id="drClose" title="Close (Esc)">${ic('x')}</button></div>
    <div class="seg">${[['details', 'Details'], ['timeline', 'Timeline'], ['history', 'Past results']].map(([k, l]) => `<button data-dtab="${k}" class="${S.dtab === k ? 'on' : ''}">${l}</button>`).join('')}</div><div class="dr-b">${b}</div>`;
}

// ---------- actions ----------
function next(v, msg) { v.stage = ORDER[ORDER.indexOf(v.stage) + 1]; toast(msg); render(); }
function primaryAct(v) {
  const now = new Date().toISOString();
  if (v.stage === 'results' && $('#go').disabled) { toast('Enter every result first', false); return; }
  if (v.stage === 'verify' && crits(v).length && !$('#infName').value.trim()) { toast('Write which doctor was informed', false); $('#infName').focus(); return; }
  if (v.stage === 'send' && !$$('[name=ch]:checked').length) { toast('Choose how to send the report', false); return; }
  snap();
  if (v.stage === 'collect') { v.tubes.forEach((t) => { t.collected ||= now; }); v.redo = null; next(v, `${v.name} — samples collected`); }
  else if (v.stage === 'receive') { v.tubes.forEach((t) => { t.received ||= now; }); next(v, `${v.name} — received in lab`); }
  else if (v.stage === 'results') { v.resultsAt = now; next(v, `${v.name} — results saved for verification`); }
  else if (v.stage === 'verify') { v.verifiedAt = now; next(v, `${v.name} — report released`); }
  else if (v.stage === 'send') { v.sentAt = now; next(v, `${v.name} — report sent`); }
}
function doTube(code) {
  const v = V.find((x) => x.tubes.some((t) => t.code === code)); if (!v) return;
  const t = v.tubes.find((x) => x.code === code); if (v.stage !== 'done') S.step = v.stage; S.sel = v.id; S.src = 'All';
  const key = v.stage === 'collect' ? 'collected' : v.stage === 'receive' ? 'received' : null;
  if (!key || t[key]) { toast(`${v.name} is already at ${v.stage === 'done' ? 'done' : v.stage}`, false); render(); return; }
  snap(); t[key] = new Date().toISOString(); beep();
  if (v.tubes.every((x) => x[key])) { if (key === 'collected') v.redo = null; next(v, `${v.name} — ${key === 'collected' ? 'samples collected' : 'received in lab'}`); }
  else { toast(`${CAPS[t.cap][0]} ${key}`); render(); }
}
function wire(v) {
  $('#go').onclick = () => primaryAct(v);
  $('#detBtn').onclick = () => { S.drawer = v.id; S.dtab = 'details'; renderDrawer(); };
  $$('[data-act]').forEach((b) => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'back') { snap(); v.stage = 'results'; toast(`${v.name} — sent back for re-entry`); render(); }
    else if (a === 'reject') { snap(); v.stage = 'collect'; v.redo = 'Sample rejected at the bench. Collect a fresh sample.'; v.tubes.forEach((t) => { t.collected = null; t.received = null; }); toast(`${v.name} — sample rejected, back to Collect`); render(); }
    else if (a === 'later') { snap(); v.createdAt = new Date().toISOString(); toast(`${v.name} moved to the end of the queue`); render(); }
    else toast({ labels: 'Labels sent to the printer', call: `Token ${v.token} called on the display`, draft: 'Draft saved', preview: 'Opening report preview…' }[a], false);
  });
  $$('[data-tube]').forEach((b) => b.onclick = () => doTube(b.dataset.tube));
  $$('[data-label]').forEach((b) => b.onclick = () => toast(`Label ${b.dataset.label} printed`, false));
  const ins = $$('[data-in]');
  ins.forEach((inp, i) => {
    const upd = () => { v.values[inp.dataset.in] = inp.value; const p = params(v).find((x) => x.name === inp.dataset.in); const f = flagOf(p, inp.value);
      inp.closest('tr').className = f + ' cur'; $(`[data-flag="${CSS.escape(p.name)}"]`).innerHTML = flagHtml(f); refreshStatus(v); };
    inp.addEventListener('input', upd); inp.addEventListener('change', upd);
    inp.addEventListener('focus', () => { $$('tr.cur').forEach((r) => r.classList.remove('cur')); inp.closest('tr').classList.add('cur'); });
    inp.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') { inp.blur(); return; }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); primaryAct(v); document.activeElement?.blur(); return; }
      if (e.key === 'Enter' || (e.key === 'ArrowDown' && inp.tagName === 'INPUT')) { e.preventDefault(); (ins[i + 1] || $('#go')).focus(); }
      if (e.key === 'ArrowUp' && inp.tagName === 'INPUT') { e.preventDefault(); ins[i - 1]?.focus(); }
    });
  });
}

// ---------- scan / search ----------
const q = $('#q'); const drop = $('#drop'); let dsel = 0;
const find = (s) => { s = s.trim().toLowerCase(); if (!s) return []; return V.filter((v) => String(v.token) === s || [v.name, v.sid, v.uhid, v.phone.replace(/\s/g, ''), ...v.tubes.map((t) => t.code)].join(' ').toLowerCase().includes(s.replace(/\s/g, ''))).slice(0, 6); };
function drawDrop() { const m = find(q.value); drop.hidden = !m.length; drop.innerHTML = m.map((v, i) => `<button class="${i === dsel ? 'on' : ''}" data-go="${v.id}">${avatar(v).replace('class="av"', 'class="av" style="width:30px;height:30px;font-size:12px;"')}<span><b style="font-weight:600">${esc(v.name)}</b> <span style="color:var(--text-3);font-size:12.5px">${where(v)} · ${v.sid}</span></span><span class="st tag">${(STEPS.find((s) => s[0] === v.stage) || [0, 'Done'])[1]}</span></button>`).join(''); $$('[data-go]', drop).forEach((b) => b.onmousedown = () => openPatient(b.dataset.go)); }
function openPatient(id) { const v = V.find((x) => x.id === id); if (v.stage !== 'done') S.step = v.stage; S.sel = id; S.src = 'All'; q.value = ''; drop.hidden = true; render(); }
q.oninput = () => { dsel = 0; drawDrop(); };
q.onkeydown = (e) => {
  e.stopPropagation(); const m = find(q.value);
  if (e.key === 'ArrowDown') { e.preventDefault(); dsel = Math.min(dsel + 1, m.length - 1); drawDrop(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); dsel = Math.max(dsel - 1, 0); drawDrop(); }
  else if (e.key === 'Escape') { q.value = ''; drop.hidden = true; q.blur(); }
  else if (e.key === 'Enter') {
    e.preventDefault(); const code = q.value.trim().toUpperCase();
    if (V.some((v) => v.tubes.some((t) => t.code === code))) { q.value = ''; drop.hidden = true; flash('ok'); doTube(code); return; }
    if (m.length) { flash('ok'); openPatient(m[dsel].id); } else { flash('miss'); toast(`Nothing found for “${q.value}”`, false); }
  }
};
q.onblur = () => setTimeout(() => { drop.hidden = true; }, 120);
function flash(c) { $('#scan').classList.add(c); setTimeout(() => $('#scan').classList.remove(c), 450); }
let actx; function beep() { try { actx ||= new AudioContext(); const o = actx.createOscillator(); const g = actx.createGain(); o.frequency.value = 1320; g.gain.value = 0.05; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.07); } catch {} }

// ---------- popovers ----------
function popover(id, html) { const was = $('#pop')?.dataset.id; closePop(); if (was === id) return; const p = document.createElement('div'); p.className = 'pop'; p.id = 'pop'; p.dataset.id = id; p.innerHTML = html; $('.main').style.position = 'relative'; $('.main').append(p); }
const closePop = () => $('#pop')?.remove();
const TODAY = `<h4>Today so far</h4><div class="stats"><div class="stat"><label>Reports sent</label><b>14</b></div><div class="stat"><label>Bill → report</label><b>2h 50m</b></div><div class="stat"><label>Samples rejected</label><b>1</b></div><div class="stat"><label>Critical values</label><b style="color:var(--red)">2</b></div></div>`;
const KEYS = `<h4>Keyboard shortcuts</h4><div class="keys"><span>Scan or search</span><span><kbd>/</kbd></span><span>Next / previous patient</span><span><kbd>↓</kbd> <kbd>↑</kbd></span><span>Go to a step</span><span><kbd>1</kbd> – <kbd>5</kbd></span><span>Main action / start entering</span><span><kbd>Enter</kbd></span><span>Save results</span><span><kbd>Ctrl</kbd> <kbd>Enter</kbd></span><span>Patient details</span><span><kbd>D</kbd></span><span>Undo</span><span><kbd>Ctrl</kbd> <kbd>Z</kbd></span></div><p style="margin:14px 0 0;font-size:12.5px;color:var(--text-3)">Demo: <a href="#" id="reset" style="color:var(--brand-2)">reset sample patients</a></p>`;

// ---------- global events ----------
document.addEventListener('click', (e) => {
  if (!e.target.closest('.pop') && !e.target.closest('#todayBtn') && !e.target.closest('#helpBtn')) closePop();
  const st = e.target.closest('[data-step]'); if (st) { S.step = st.dataset.step; S.sel = null; S.src = 'All'; render(); }
  const sr = e.target.closest('[data-src]'); if (sr) { S.src = sr.dataset.src; render(); }
  const r = e.target.closest('.row'); if (r) { S.sel = r.dataset.id; render(); }
  const dt = e.target.closest('[data-dtab]'); if (dt) { S.dtab = dt.dataset.dtab; renderDrawer(); }
  if (e.target.closest('#drClose') || e.target.id === 'scrim') { S.drawer = null; renderDrawer(); }
  if (e.target.closest('#todayBtn')) popover('today', TODAY);
  if (e.target.closest('#helpBtn')) popover('keys', KEYS);
  if (e.target.id === 'reset') { e.preventDefault(); V = build(); undoSnap = null; Object.assign(S, { step: 'collect', src: 'All', sel: null, drawer: null }); closePop(); render(); }
});
document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
  if (e.key === 'Escape') { if (S.drawer) { S.drawer = null; renderDrawer(); } closePop(); }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); return; }
  const vis = visible(); const i = vis.findIndex((v) => v.id === S.sel); const v = V.find((x) => x.id === S.sel);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.sel = vis[Math.max(0, Math.min(vis.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]?.id; render(); $('.row.sel')?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key >= '1' && e.key <= '5') { e.preventDefault(); S.step = STEPS[+e.key - 1][0]; S.sel = null; S.src = 'All'; render(); }
  else if ((e.key === 'd' || e.key === 'D') && v) { S.drawer = S.drawer ? null : v.id; S.dtab = 'details'; renderDrawer(); }
  else if (e.key === '?') popover('keys', KEYS);
  else if (e.key === 'Enter' && v && !S.drawer && document.activeElement.tagName !== 'BUTTON') {
    e.preventDefault();
    if (v.stage === 'results') { const ins = $$('[data-in]'); (ins.find((x) => !x.value) || ins[0])?.focus(); } else primaryAct(v);
  }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});

// ---------- toast ----------
let tt; function toast(msg, canUndo = true) { const t = $('#toast'); $('#toastMsg').textContent = msg; t.classList.toggle('bad', !canUndo && /first|Write|Choose|Nothing/.test(msg)); $('.ti', t).innerHTML = ic(t.classList.contains('bad') ? 'x' : 'check'); $('#undo').style.display = canUndo && undoSnap ? '' : 'none'; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(hideToast, 4000); }
function hideToast() { $('#toast').classList.remove('show'); }
$('#undo').onclick = undo;
render();
</script>
</body>
</html>
