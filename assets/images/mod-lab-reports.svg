<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E4F2F3" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#E6F4F5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#B9E1E4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3BA8B0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A7C86" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F2C44" flood-opacity="0.09"/>
    </filter>
  </defs>
  <path d="M0,220 C180,180 340,60 600,40 L600,260 L0,260 Z" fill="url(#gBg)"/>
  <!-- Back frosted report sheet -->
  <g transform="translate(360 32) rotate(-7)" filter="url(#sh)">
    <rect width="128" height="164" rx="14" fill="url(#gGlass)" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="18" y="24" width="52" height="6" rx="3" fill="#0A7C86" fill-opacity="0.22"/>
    <rect x="18" y="42" width="90" height="4" rx="2" fill="#0F2C44" fill-opacity="0.1"/>
    <rect x="18" y="54" width="76" height="4" rx="2" fill="#0F2C44" fill-opacity="0.08"/>
  </g>
  <!-- Front frosted glass report / slide plate -->
  <g transform="translate(415 54) rotate(4)" filter="url(#sh)">
    <rect width="136" height="170" rx="16" fill="url(#gGlass)" stroke="#FFFFFF" stroke-width="1.8"/>
    <rect x="20" y="26" width="64" height="7" rx="3.5" fill="url(#gTeal)"/>
    <rect x="20" y="48" width="96" height="5" rx="2.5" fill="#0F2C44" fill-opacity="0.12"/>
    <rect x="20" y="62" width="84" height="5" rx="2.5" fill="#0F2C44" fill-opacity="0.09"/>
    <rect x="20" y="76" width="92" height="5" rx="2.5" fill="#0F2C44" fill-opacity="0.09"/>
    <rect x="20" y="102" width="96" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#0A7C86" stroke-opacity="0.18"/>
    <path d="M32 124 L48 114 L64 126 L82 110 L102 120" stroke="#0A7C86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
  </g>
  <!-- Optical glass loupe ring -->
  <g transform="translate(495 148)" filter="url(#sh)">
    <circle cx="36" cy="36" r="32" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="36" cy="36" r="30" stroke="#0A7C86" stroke-opacity="0.35" stroke-width="1.2"/>
    <path d="M59 59 L78 78" stroke="url(#gTeal)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
