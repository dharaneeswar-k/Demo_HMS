<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#E3F2F3" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#B4DFE2" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="gLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EC8CF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0A7C86" stop-opacity="0.82"/>
