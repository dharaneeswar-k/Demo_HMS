  </g>
  <!-- Reagent bottle 1 -->
  <g transform="translate(356 62)" filter="url(#sh)">
    <rect x="16" y="0" width="28" height="22" rx="5" fill="#0A7C86" fill-opacity="0.78" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M12 22 H48 L56 44 V116 C56 123 50 128 43 128 H17 C10 128 4 123 4 116 V44 Z" fill="url(#gGlass)" stroke="#FFFFFF" stroke-width="1.6"/>
