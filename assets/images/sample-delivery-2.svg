    <rect x="708" y="318" width="54" height="132" rx="10" fill="url(#amber)"/><rect x="717" y="296" width="36" height="26" rx="4" fill="#e8e8e8"/><rect x="712" y="364" width="46" height="50" fill="#f5f1e8"/><rect x="718" y="376" width="34" height="6" fill="#0d8a7a"/>
