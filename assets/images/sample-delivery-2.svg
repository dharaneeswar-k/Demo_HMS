    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f5f6"/><stop offset=".5" stop-color="#cfd6db"/><stop offset="1" stop-color="#eef1f3"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b3410"/><stop offset=".45" stop-color="#a65a1f"/><stop offset="1" stop-color="#5a2b0d"/></linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/></radialGradient>
