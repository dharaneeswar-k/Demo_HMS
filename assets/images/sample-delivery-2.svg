    <g transform="rotate(4 430 150)"><rect x="330" y="104" width="200" height="96" rx="4" fill="#fff"/><rect x="330" y="104" width="200" height="26" rx="4" fill="#0d8a7a"/><text x="344" y="122" font-size="13" font-weight="bold" fill="#fff">PANTOPRAZOLE 40</text><text x="344" y="154" font-size="10" fill="#33414c">15 Tablets × 10 Strips</text><text x="344" y="172" font-size="9" fill="#66737d">B.No PA7C0931 · EXP 01/2028</text></g>
    <g transform="rotate(-2 660 170)"><rect x="565" y="120" width="190" height="96" rx="4" fill="#fff"/><rect x="565" y="120" width="190" height="26" rx="4" fill="#8a3b8f"/><text x="579" y="138" font-size="13" font-weight="bold" fill="#fff">METFORMIN 500</text><text x="579" y="170" font-size="10" fill="#33414c">20 Tablets × 10 Strips</text><text x="579" y="188" font-size="9" fill="#66737d">B.No GL2M5520 · EXP 04/2028</text></g>
