    <g fill="#24408f" font-size="11" font-style="italic"><text x="96" y="481">Dolo 650 — 150 + 10 free ✓</text><text x="96" y="501">Pan 40 — 100 ✓</text><text x="96" y="521">Glycomet 500 — 120 ✓</text><text x="96" y="541">Amlong 5 — 80 ✓</text></g></g>
